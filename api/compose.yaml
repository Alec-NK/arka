name: arka

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arka}
      POSTGRES_DB: ${POSTGRES_DB:-arka}
    ports:
      # Expose PostgreSQL on the host at 5446; containers still use db:5432.
      - "${POSTGRES_PORT:-5446}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init-runtime-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arka} -d ${POSTGRES_DB:-arka}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      target: development
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      CI: "true"
      PORT: 3000
      DATABASE_URL: postgresql://${APP_DATABASE_USER:-arka_app}:${APP_DATABASE_PASSWORD:-arka_app}@db:5432/${POSTGRES_DB:-arka}?schema=public
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER:-arka}:${POSTGRES_PASSWORD:-arka}@db:5432/${POSTGRES_DB:-arka}?schema=public
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      # Live source for hot reload; node_modules stays inside the container (Linux binaries).
      - ./:/app
      - api-node-modules:/app/node_modules

volumes:
  db-data:
  api-node-modules:
